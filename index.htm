<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="utf-8">
    <link rel="icon" href="assets/img/book-open.ico" type="image/x-icon">
    <title>MyLiberty</title>
    <style>
        /* ZÁKLADNÍ DESIGN */
        body { background-color: #121212; color: #fff; font-family: 'Nunito Sans', sans-serif; margin: 0; }
        @font-face {
            font-family: 'Nunito Sans';
            src: url('assets/fonts/NunitoSans-VariableFont_YTLC\,opsz\,wdth\,wght.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        @font-face {
            font-family: 'MojeHemiHead';
            src: url('assets/fonts/HemiHead-BoldItalic.otf');
        }

        h1, h2 {
            font-family: 'MojeHemiHead', sans-serif;
        }
        
        /* HORNÍ ŠEDÁ LIŠTA */
        .header {
            background-color: #1a1a1a;
            height: 60px;
            display: flex;
            align-items: center;
            padding: 0 40px;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid #252525;
            justify-content: space-between;
        }
        .header .logo { font-weight: bold; font-size: 20px; letter-spacing: 1px; color: #eee; }
        .header nav { display: flex; gap: 30px; }
        .header nav a { color: #888; text-decoration: none; font-size: 16px; text-transform: uppercase; transition: 0.3s; }
        .header nav a:hover { color: #fff; }
        .header .search-box { background: #252525; border: none; padding: 8px 15px; border-radius: 20px; color: #fff; width: 200px; font-size: 13px; }

        /* FILTRY A OBSAH */
        .container { padding: 20px 40px 20px 40px; max-width: 1250px; margin: auto; }

        /* MŘÍŽKA (GRID) */
        #ajaxContent {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 30px;
        }

        /* KARTA SERIÁLU */
        .filterDiv { display: none; } 
        .show { display: block; }
        .anime-card { position: relative; transition: 0.4s ease; }
        .anime-card:hover { transform: scale(1.05); z-index: 10; }
        .anime-card img { width: 100%; border-radius: 8px; display: block; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        
        .ep-badge {
            background: #ffcc00; color: #000; font-weight: bold;
            padding: 3px 10px; border-radius: 15px; font-size: 10px;
            position: absolute; bottom: 60px; left: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .title { font-size: 14px; margin: 12px 0 2px 0; color: #eee; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .year { color: #666; font-size: 12px; font-weight: 600; }

        .anime-card a { text-decoration: none; color: inherit; display: block; /* Aby odkaz vyplnil celou kartu */ }

        .main-links-wrapper {
            display: flex;
            justify-content: center; /* Vycentrování na střed */
            gap: 30px;
            margin: 40px 0;
        }

        /* VELKÉ ROZCESTNÍKY */
        .main-link-box {
            background: #1a1a1a;
            width: 300px; /* Šířka obdélníku */
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #333;
            transition: 0.3s;
            text-decoration: none;
            display: block;
        }

        .main-link-box:hover {
            border-color: #555;
            background: #222;
            transform: translateY(-5px);
        }

    </style>
</head>

<body>

        <h1>Vítej v MyLiberty</h1>
        </div>

        <!-- VELKÉ ROZCESTNÍKY -->

    </div>
</body>
</html>
